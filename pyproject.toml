[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "render-and-rise-automation"
version = "1.0.0"
description = "Python automation pipeline for digital-product processing, QA, mockups and cloud delivery."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Omar Nayyar" }]
dependencies = [
    "dropbox>=12.0.2,<13",
    "docx2pdf>=0.1.8,<1",
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
    "Pillow>=10.3,<13",
    "PySide6>=6.8,<7",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
render-rise-gui = "render_and_rise.rr_gui:main"
render-rise-pipeline = "render_and_rise.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
